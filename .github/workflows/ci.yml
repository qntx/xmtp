name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match Makefile NIGHTLY (rustfmt.toml group_imports / cbindgen expand).
  NIGHTLY: nightly-2026-08-03

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.120.0

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --verbose --all-features

      - name: Test
        run: cargo test --workspace --verbose --all-features

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo +"$NIGHTLY" fmt --all --check

      - name: clippy
        run: make clippy NIGHTLY="$NIGHTLY"

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: cargo +1.94 check
        run: cargo +1.94 check --workspace --all-features

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.120.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny (workspace + xmtp-ffi)
        run: |
          cargo deny --manifest-path xmtp-sys/Cargo.toml check
          cargo deny --manifest-path xmtp-ffi/Cargo.toml check

  bindings:
    name: bindings dirty
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: Regenerated bindings match committed
        run: |
          make regenerate-bindings
          git diff --exit-code xmtp-sys/src/bindings.rs
