name: Build FFI

on:
  push:
    tags:
      - "ffi-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "FFI version override (e.g. 0.1.0)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libxmtp_ffi.a
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libxmtp_ffi.a
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libxmtp_ffi.a
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            lib: xmtp_ffi.lib
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            lib: xmtp_ffi.lib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.10.0"

      - name: libxmtp tag
        id: libxmtp
        shell: bash
        run: |
          tag=$(sed -n 's/.*tag = "\([^"]*\)".*/\1/p' xmtp-ffi/Cargo.toml | head -1)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xmtp-ffi
          key: ${{ matrix.target }}-${{ steps.libxmtp.outputs.tag }}

      - name: Build static library
        working-directory: xmtp-ffi
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "xmtp-ffi/target/${{ matrix.target }}/release/${{ matrix.lib }}" dist/
          cp xmtp-ffi/include/xmtp_ffi.h dist/
          tar -czf "xmtp-ffi-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "xmtp-ffi\target\${{ matrix.target }}\release\${{ matrix.lib }}" dist\
          Copy-Item xmtp-ffi\include\xmtp_ffi.h dist\
          Compress-Archive -Path dist\* -DestinationPath "xmtp-ffi-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: xmtp-ffi-${{ matrix.target }}
          path: xmtp-ffi-${{ matrix.target }}.*

  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Write SHA256SUMS
        env:
          VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/ffi-v* ]]; then
            VERSION="${GITHUB_REF_NAME#ffi-v}"
          elif [[ -n "${VERSION_OVERRIDE}" ]]; then
            VERSION="${VERSION_OVERRIDE}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' xmtp-ffi/Cargo.toml | head -1)
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "failed to resolve FFI VERSION" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}"

          {
            sha256sum xmtp-ffi-x86_64-unknown-linux-gnu.tar.gz
            sha256sum xmtp-ffi-aarch64-unknown-linux-gnu.tar.gz
            sha256sum xmtp-ffi-aarch64-apple-darwin.tar.gz
            sha256sum xmtp-ffi-x86_64-pc-windows-msvc.zip
            sha256sum xmtp-ffi-aarch64-pc-windows-msvc.zip
          } > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error

      - name: Compare committed map
        run: |
          set -euo pipefail
          MAP="xmtp-sys/sha256sums/${VERSION}"
          if [[ -f "${MAP}" ]]; then
            sha256sum -c "${MAP}"
          else
            echo "No committed map at ${MAP}; skip-if-absent (dry-run)."
          fi

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ffi-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            xmtp-ffi-*.tar.gz
            xmtp-ffi-*.zip
          generate_release_notes: true

  # Publish xmtp-sys to crates.io after the FFI release is available.
  # xmtp-sys version tracks FFI version — its build.rs downloads the matching
  # FFI release using CARGO_PKG_VERSION.
  publish-sys:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ffi-v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish xmtp-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p xmtp-sys
