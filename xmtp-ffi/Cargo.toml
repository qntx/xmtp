[package]
name = "xmtp-ffi"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "C FFI wrapper around libxmtp for xmtp-sys"

# Standalone workspace root — keeps libxmtp's dependency tree separate from the
# parent workspace. libxmtp crates are pulled from the upstream xmtp/libxmtp
# repository pinned to a release tag.
[workspace]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# libxmtp core crates (pinned to upstream release tag)
xmtp_mls = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_api = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_api_grpc = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_api_d14n = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_db = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_id = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_proto = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_common = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_cryptography = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_content_types = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_configuration = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_mls_common = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
xmtp_archive = { git = "https://github.com/xmtp/libxmtp", tag = "v1.11.0" }
# libxmtp's workspace-hack enables this PQ feature; we do not copy that crate.
openmls_rust_crypto = { git = "https://github.com/xmtp/openmls", rev = "3fabbf23d417ac80e787ca858a5134c6ca1d9ce6", features = ["draft-ietf-mls-pq-ciphersuites"] }

# Runtime & utilities
# libxmtp v1.11.0 lock is alloy 2.1.1; 2.4+ renamed ProviderBuilder::connect_http.
alloy = "=2.4.2"
http = "1.4.0"
tokio = { version = "1.52.1", features = ["full"] }
hex = { package = "const-hex", version = "1.18.1" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
async-trait = "0.1"

[build-dependencies]
cbindgen = "0.29.2"

# Verbatim from xmtp/libxmtp Cargo.toml at v1.11.0 (cf3b084d).
# All four hpke sister crates are mandatory: patching a subset breaks
# openmls_libcrux_crypto (two HpkeCrypto trait versions). Do not pre-prune.
[patch.crates-io]
diesel = { git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" }
diesel_migrations = { git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" }
hpke-rs = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
hpke-rs-crypto = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
hpke-rs-libcrux = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
hpke-rs-rust-crypto = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
tracing-oslog = { git = "https://github.com/xmtp/tracing-oslog", rev = "69cebec3804c33267b8d18aa50a5d9ba18617121" }

